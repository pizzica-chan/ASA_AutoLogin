# ASA_Login 設定ファイル

display:
  monitor_index: 1  # ARK を表示しているモニター（1 始まり）

retry:
  max_attempts: 0          # 最大試行回数（0 = 無制限）
  delay_seconds: 3.0       # 失敗後、①に戻ってから次の試行までの待ち（秒）
  poll_interval: 0.5       # 画面・ボタン状態のチェック間隔
  transition_settle: 0.4   # ボタン検出後、クリック前の安定待ち
  after_click_delay: 2.0   # クリック後の画面遷移待ち
  transition_timeout: 20.0 # 次の UI が出るまでの最大待機
  join_click_delay: 1.5      # 後方互換（after_click_delay 優先）
  check_interval: 0.5        # 後方互換（poll_interval 優先）
  result_timeout: 120.0        # ③ ログイン結果の最大待ち
  login_movie_timeout: 120.0   # ③ ログイン動画の追加待ち
  mods_wait_seconds: 8.0       # ② MODS 画面の確認時間
  recovery_timeout: 45.0       # 失敗後の画面復帰待ち（上限）
  stuck_server_list_seconds: 30.0  # ③ 停滞とみなす時間
  start_countdown_seconds: 3

matching:
  threshold: 0.8               # 汎用しきい値（後方互換）
  screen_threshold: 0.75       # 画面全体の一致度
  button_threshold: 0.75       # ボタン画像の一致度
  button_threshold_relaxed: 0.68 # ボタン再検索時の緩い一致度
  mods_screen_threshold: 0.55  # ② MODS 画面の一致度
  screen_ready_margin: 0.05    # ① 復帰判定のゆるさ
  click_mode: image  # image | image_only | coordinates | coordinates_only

# 画面全体キャプチャ（① はセットアップで登録。他は同梱デフォルトで補完）
templates:
  server_list: templates/server_list.png
  required_mods: templates/required_mods.png
  connection_failed: templates/connection_failed.png
  login_movie: templates/login_movie.png
  network_failure: templates/network_failure.png
  title_screen: templates/title_screen.png
  server_list_empty: templates/server_list_empty.png
  main_menu: templates/main_menu.png
  in_game: templates/in_game.png

# 座標フォールバック（ボタン画像は templates/buttons/ の PNG を使用・差し替え可）
ui:
  join_server_list:
    x_percent: 92.0
    y_percent: 92.0
  join_mods:
    x_percent: 42.0
    y_percent: 92.0
  cancel_failed:
    x_percent: 55.0
    y_percent: 55.0
  accept_network_failure:
    x_percent: 50.0
    y_percent: 60.0
  back_empty_list:
    x_percent: 5.0
    y_percent: 92.0
  join_game:
    x_percent: 29.0
    y_percent: 91.0

window:
  title_contains: "ARK: Survival Ascended"
  bring_to_front: true

logging:
  user_file: logs/asa_login_user.log
  detail_file: logs/asa_login_detail.log
  user_level: INFO
  detail_level: DEBUG
